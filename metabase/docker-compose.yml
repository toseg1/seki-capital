# ===========================================================================
# Standalone Metabase
#
# This is deliberately its OWN compose project, separate from the one in
# the repo root. Run it once and leave it running: your Metabase account,
# dashboards and saved questions then live outside any single project's
# database, so wiping/regenerating Seki Capital's Postgres (or trying a
# different practice dataset entirely) never forces you to recreate them.
#
#     cd metabase
#     docker compose up -d
#
# Then open http://localhost:3000, create your account (first run only),
# and add a database using the settings in the repo README.
#
# To stop it without losing your account/dashboards: docker compose down
# (no -v). Only "docker compose down -v" from inside this folder would
# wipe the Metabase app database — the root docker-compose.yml can never
# touch it, since it's a completely separate project/volume.
# ===========================================================================

services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Paris
    volumes:
      - mbdata:/metabase-data
    extra_hosts:
      # Lets this container reach Postgres via the host's published port,
      # regardless of which project/network Postgres itself runs in.
      # Works out of the box on Docker Desktop (macOS/Windows); on Linux
      # this line is what makes host.docker.internal resolve at all.
      - "host.docker.internal:host-gateway"

volumes:
  mbdata:
