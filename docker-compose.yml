# ===========================================================================
# Seki Capital - PostgreSQL
#
#     docker compose up -d
#
# On first start Postgres runs docker/init.sh, which builds the schema, loads
# the CSVs and runs the data quality checks. Watch it with:
#
#     docker compose logs -f postgres
#
# Metabase is a separate, standalone stack (see metabase/docker-compose.yml)
# so it keeps its own account and dashboards even when you wipe and reload
# this database. See the README for how to run it and connect it here.
# ===========================================================================

services:
  postgres:
    image: postgres:16
    container_name: seki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seki
      POSTGRES_PASSWORD: seki
      POSTGRES_DB: seki
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Host 5432 -> container 5432. If you already run Postgres locally,
      # change this to "55432:5432" and use port 55432 from the host.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The repo is mounted read-only so init.sh can reach sql/ and data/
      # at the same relative paths you would use from the host.
      - ./:/project:ro
      - ./docker/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seki -d seki"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
